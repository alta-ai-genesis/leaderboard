<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AI Genesis Challenge live leaderboard by ALTA School of Technology">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}img{max-width:100%}</style>
<title>AI Genesis Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style id="app-css">
/* Layout: one centred column — header, podium, prize ladder, searchable ranked table. */
:root{
  --bg:#F3FAFC; --surface:#FFFFFF; --surface-2:#E8F5F9; --line:#D6E9EF;
  --ink:#0D1E56; --muted:#56607A; --cyan:#3BC3E2; --green:#3CCC8B; --amber:#FCC032; --coral:#FF8A73;
  --gold:#F2B21B; --silver:#A9B6C8; --bronze:#D98E5F; --on-accent:#0D1E56; --danger:#C2412E;
  --font-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1433; --surface:#111D45; --surface-2:#16255A; --line:#24356E;
  --ink:#EAF2FF; --muted:#A3B0CF; --on-accent:#0A1433; --danger:#FF8A73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1433; --surface:#111D45; --surface-2:#16255A; --line:#24356E;
  --ink:#EAF2FF; --muted:#A3B0CF; --on-accent:#0A1433; --danger:#FF8A73; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1,h2,h3{margin:0;font-family:var(--font-display);text-wrap:balance}
.mono{font-family:var(--font-mono)}
.eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:6px}
.wordmark{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.wordmark b{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,6vw,46px);letter-spacing:-.03em}
.wordmark span{margin-top:6px;transform:rotate(-3deg);background:linear-gradient(90deg,var(--cyan),var(--green));color:#fff;font-weight:800;font-size:clamp(14px,2.6vw,19px);letter-spacing:.12em;padding:4px 12px;border-radius:7px;box-shadow:4px 4px 0 var(--ink)}
.subtitle{color:var(--muted);margin:10px 0 0;max-width:52ch}
.status{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.live{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(60,204,139,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(60,204,139,0)}100%{box-shadow:0 0 0 0 rgba(60,204,139,0)}}
@media (prefers-reduced-motion: reduce){.live i{animation:none}}
.updated{font-size:12.5px;color:var(--muted)}
/* podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.pod .medal{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-mono);color:#0D1E56}
.pod.r1{order:2;border:2px solid var(--gold);padding-block:26px 22px}
.pod.r2{order:1}.pod.r3{order:3}
.pod.r1 .medal{background:var(--gold);width:54px;height:54px;font-size:20px}
.pod.r2 .medal{background:var(--silver)}.pod.r3 .medal{background:var(--bronze)}
.pod .nm{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.pod .meta{color:var(--muted);font-size:13px}
.pod .sc{font-family:var(--font-mono);font-weight:700;font-size:22px}
.pod.empty .nm{color:var(--muted);font-weight:600}
/* prize ladder */
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.rung{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rung .rk{font-family:var(--font-mono);font-weight:700;font-size:12.5px;color:var(--muted)}
.rung .pz{font-weight:800}
.rung.gp{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rung.gp .rk{color:var(--amber)}
/* table */
.board{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-width:0;flex:0 1 300px}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0;width:100%;min-width:0;outline:none}
.search:focus-within{outline:2px solid var(--cyan);outline-offset:1px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-family:var(--font-mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.rank{font-family:var(--font-mono);font-weight:700;width:56px}
td.name b{display:block;font-weight:700;overflow-wrap:anywhere}
td.name small{color:var(--muted)}
td.score{font-family:var(--font-mono);font-weight:700;font-size:16px;text-align:right;white-space:nowrap}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);min-width:120px}
.bar span{display:block;height:100%}
.chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.c1{background:var(--coral);color:#0D1E56}.c5{background:var(--cyan);color:#0D1E56}.c10{background:var(--green);color:#0D1E56}.c50{background:var(--amber);color:#0D1E56}
tr.hit td{background:color-mix(in srgb,var(--amber) 18%,transparent)}
.empty-state{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty-state b{font-size:18px}
.empty-state p{margin:0;color:var(--muted);max-width:46ch}
/* scoring */
.scoring{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.wlist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.wrow{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center}
.wrow i{width:12px;height:12px;border-radius:50%}
.wrow b{font-family:var(--font-mono)}
.wrow small{display:block;color:var(--muted)}
.notes{margin:12px 0 0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
/* editor */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer}
.btn:hover{border-color:var(--cyan)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{color:var(--danger)}
.editor{display:flex;flex-direction:column;gap:14px}
.editor .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.editor textarea{width:100%;min-height:110px;font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.editor input[type=text],.editor input[type=number]{font:inherit;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 6px}
.sheet td,.sheet th{padding:6px 6px}
.sheet input[type=number]{width:52px;text-align:center}
.sheet input.nm{width:150px}.sheet input.ct{width:96px}
.sheet input.pj{width:60px}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--danger)}
footer{color:var(--muted);font-size:12.5px;text-align:center}
.alta{height:42px;width:auto;margin-bottom:14px;display:block;align-self:flex-start;object-fit:contain}.alta.dk{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .alta.lt{display:none}:root:not([data-theme="light"]) .alta.dk{display:block}}
:root[data-theme="dark"] .alta.lt{display:none}:root[data-theme="dark"] .alta.dk{display:block}
.rb{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;font-weight:800;color:#0D1E56;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 6px rgba(13,30,86,.18)}
.rb1{background:linear-gradient(135deg,#FFE58A,#F2B21B 60%,#D9930A)}.rb2{background:linear-gradient(135deg,#F4F7FB,#B8C3D3 60%,#8D9AAE)}.rb3{background:linear-gradient(135deg,#F6CDAE,#D98E5F 60%,#B36B3E)}
.pod.r1 .medal{background:linear-gradient(135deg,#FFE58A,#F2B21B 60%,#D9930A)}.pod.r2 .medal{background:linear-gradient(135deg,#F4F7FB,#B8C3D3 60%,#8D9AAE)}.pod.r3 .medal{background:linear-gradient(135deg,#F6CDAE,#D98E5F 60%,#B36B3E)}
.pod .medal{box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 3px 8px rgba(13,30,86,.2)}
@media (max-width:720px){
  .podium{gap:8px}
  .pod{padding:14px 6px;border-radius:14px}
  .pod.r1{padding-block:18px 16px}
  .pod .medal{width:32px;height:32px;font-size:13px}
  .pod.r1 .medal{width:38px;height:38px;font-size:15px}
  .pod .nm{font-size:14px}.pod .meta{font-size:12px}.pod .sc{font-size:17px}
  td,th{padding-left:8px;padding-right:8px}
  td.rank{width:40px}
  .chip{font-size:10.5px;padding:3px 8px}
  .ladder{grid-template-columns:1fr 1fr} .rung.gp{grid-column:1/-1}
  .scoring{grid-template-columns:1fr}
  .status{align-items:flex-start}
  th.bk,td.bk{display:none}
}
</style>
</head>

<script id="app-js">
(function(){
  "use strict";
  var TPL = document.getElementById("app-template");
  document.getElementById("mount").appendChild(TPL.content.cloneNode(true));
    var W = {project:50, homework:25, quiz:10, attendance:10, social:5};
  var COLORS = {project:"var(--ink)", homework:"var(--cyan)", quiz:"var(--amber)", attendance:"var(--coral)", social:"var(--green)"};
  var LABELS = {project:["Final project","Project + 3-minute demo, out of 100"], homework:["Homework builds","4 builds, each out of 10"], quiz:["Session quizzes","Quiz % in each of the 4 sessions"], attendance:["Attendance","Present for each live level"], social:["Social engagement","LinkedIn post + Instagram follow"]};
  var state = {stage:"Loading…", updated:"", students:[]};

  function n(v){ var x = parseFloat(v); return isFinite(x) ? x : 0; }
  function arr4(a){ a = Array.isArray(a) ? a : []; return [0,1,2,3].map(function(i){ return a[i] === "" || a[i] == null ? null : n(a[i]); }); }
  function clamp(x,lo,hi){ return Math.max(lo, Math.min(hi, x)); }
  function parts(s){
    var att = arr4(s.att), q = arr4(s.quiz), hw = arr4(s.hw);
    var sum = function(a,cap){ return a.reduce(function(t,v){ return t + (v==null?0:clamp(v,0,cap)); },0); };
    return {
      project: clamp(n(s.project),0,100)/100*W.project,
      homework: sum(hw,10)/40*W.homework,
      quiz: sum(q,100)/400*W.quiz,
      attendance: sum(att,1)/4*W.attendance,
      social: (clamp(n(s.li),0,1)+clamp(n(s.ig),0,1))/2*W.social,
      _p: clamp(n(s.project),0,100), _hw: sum(hw,10), _q: sum(q,100)
    };
  }
  function ranked(){
    var list = state.students.map(function(s){ var p = parts(s); var t = p.project+p.homework+p.quiz+p.attendance+p.social; return {s:s,p:p,total:Math.round(t*10)/10}; });
    list.sort(function(a,b){ return b.total-a.total || b.p._p-a.p._p || b.p._hw-a.p._hw || b.p._q-a.p._q || String(a.s.name).localeCompare(String(b.s.name)); });
    var r = 0, prev = null;
    list.forEach(function(x,i){ var key = [x.total,x.p._p,x.p._hw,x.p._q].join("|"); if (key !== prev) r = i+1; prev = key; x.rank = r; });
    return list;
  }
  function tier(r){ if (r===1) return ["PS5 + GTA 6","c1"]; if (r<=5) return ["AI subscription","c5"]; if (r<=10) return ["Alta merch","c10"]; if (r<=25) return ["Scholarship + LoR","c50"]; if (r<=50) return ["LoR","c50"]; return null; }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmtDate(iso){ if (!iso) return ""; var d = new Date(iso); if (isNaN(d)) return ""; return "Refreshed " + d.toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}); }

  function renderHeader(){
    document.getElementById("stage").textContent = state.stage || "Starting soon";
    document.getElementById("updated").textContent = fmtDate(state.updated);
  }
  function renderPodium(list){
    var pod = document.getElementById("podium"); pod.textContent = "";

      if (x){ c.appendChild(el("div","nm", x.s.name || "Unnamed")); if (x.s.city) c.appendChild(el("div","meta", x.s.city)); c.appendChild(el("div","sc", x.total.toFixed(1))); }
      else { c.appendChild(el("div","nm","Waiting for scores")); c.appendChild(el("div","meta", i===0 ? "Rank #1 wins the PS5 + GTA 6" : "Top 5 win a 1-year AI subscription")); }
      pod.appendChild(c);
    }
  }
  function bar(p){
    var b = el("div","bar"); ["project","homework","quiz","attendance","social"].forEach(function(k){ var sp = el("span"); sp.style.width = (p[k])+"%"; sp.style.background = COLORS[k]; sp.title = LABELS[k][0]+": "+p[k].toFixed(1)+" / "+W[k]; b.appendChild(sp); }); return b;
  }
  function renderTable(list){
    var box = document.getElementById("tbl"); box.textContent = "";
    if (!list.length){
      var e = el("div","empty-state"); e.appendChild(el("b",null,"Scores go live after Level 1")); e.appendChild(el("p",null,"Level 1: Spot the Glitch is on Sat, 14 Nov at 6 PM. Attend, take the quiz and submit your homework build to get on the board."));
      box.appendChild(e); return;

    var q = (document.getElementById("q").value || "").trim().toLowerCase();
    var t = el("table"), th = el("thead"), hr = el("tr");
    [["Rank",""],["Student",""],["Breakdown","bk"],["Score",""]].forEach(function(h){ var c = el("th",h[1],h[0]); if (h[0]==="Score") c.style.textAlign="right"; hr.appendChild(c); });
    th.appendChild(hr); t.appendChild(th);
    var tb = el("tbody"), shown = 0;
    list.forEach(function(x){
      var name = String(x.s.name||""), hit = q && (name.toLowerCase().indexOf(q) > -1 || String(x.s.city||"").toLowerCase().indexOf(q) > -1);
      if (q && !hit) return;
      shown++;
      var tr = el("tr", hit ? "hit" : "");
      var rc = el("td","rank"); if (x.rank <= 3) rc.appendChild(el("span","rb rb"+x.rank, String(x.rank))); else rc.textContent = "#"+x.rank; tr.appendChild(rc);
      var nm = el("td","name"); nm.appendChild(el("b",null,name || "Unnamed")); if (x.s.city) nm.appendChild(el("small",null,x.s.city)); tr.appendChild(nm);

  var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSw7e6MUctwEE32d1JoS99GiRw4rMJkP_S3TOssqs1v5nNze71e3_NWEUr5eLvpCK7oyUUxHrjJFW3c/pub?gid=254785656&single=true&output=csv";
  function parseCSV(text){
    var rows = [], row = [], f = "", q = false;
    for (var i = 0; i < text.length; i++){
      var c = text[i];
      if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ','){ row.push(f); f = ""; }
      else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ""; }
      else if (c !== '\r') f += c;
    }
    if (f !== "" || row.length){ row.push(f); rows.push(row); }
    return rows;
  }
  function num(v){ v = String(v == null ? "" : v).replace("%","").trim(); return v === "" ? null : n(v); }
  function load(){
    fetch(CSV_URL + (CSV_URL.indexOf("?") > -1 ? "&" : "?") + "t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(text){
        var all = parseCSV(text), head = (all[0] || []).map(function(h){ return String(h).trim().toLowerCase(); });
        function col(name){ return head.indexOf(name.toLowerCase()); }
        function g(c, name){ var i = col(name); return i > -1 ? c[i] : ""; }
        var rows = all.slice(1).filter(function(c){ return c[0] && c[0].trim(); });
        state.students = rows.map(function(c){
          return {name:c[0].trim(), city:String(g(c,"City")||"").trim(),
            att:["Att L1","Att L2","Att L3","Att L4"].map(function(h){ return num(g(c,h)); }),
            quiz:["Quiz L1","Quiz L2","Quiz L3","Quiz L4"].map(function(h){ return num(g(c,h)); }),
            hw:["HW L1","HW L2","HW L3","HW L4"].map(function(h){ return num(g(c,h)); }),
            project:num(g(c,"Project")), li:num(g(c,"LinkedIn"))?1:0, ig:num(g(c,"Instagram"))?1:0};
        });
        state.stage = state.students.length ? "Live" : "Starting soon";
        state.updated = new Date().toISOString();
        renderAll();
      })
      .catch(function(){ document.getElementById("updated").textContent = "Couldn't refresh, retrying…"; });
  }
  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
